name: Expire branch previews
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: read
cache-mode: none
defaults:
  run:
    shell: bash
jobs:
  discover:
    runs-on: ubuntu-24.04
    environment: preview-release
    # GitHub includes abandoned drafts only for callers with push access.
    permissions:
      contents: write
      actions: read
      checks: read
    outputs:
      ids: ${{ steps.expired.outputs.ids }}
      any: ${{ steps.expired.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: expired
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_cleanup.py discover
  delete:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        id: ${{ fromJSON(needs.discover.outputs.ids) }}
    runs-on: ubuntu-24.04
    environment: preview-release
    concurrency:
      group: preview-${{ matrix.id }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      checks: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_ID: ${{ matrix.id }}
        run: python3 scripts/preview_cleanup.py delete --id "$PREVIEW_ID"
