name: Verify installations
run-name: Verify ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable stable tag; use reviewed master tooling'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  attestations: read
concurrency:
  group: installation-verification-${{ inputs.tag }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  gate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/verify_installations.py gate --tag "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tap-commit-${{ github.run_attempt }}
          path: target/tap-commit.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-verification-${{ github.run_attempt }}
          path: target/public-verification.json
          if-no-files-found: error
          retention-days: 90
  install:
    name: Homebrew (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@082c94ee19e776205cfa8e43802917d1425e2fe7 # reviewed 2026-09-14
        with:
          stable: true
          brew-gh-api-token: ''
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TAP_COMMIT: ${{ needs.gate.outputs.commit }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/verify_installations.py homebrew --tag "$TAG" --commit "$TAP_COMMIT" --target "$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-${{ matrix.target }}-${{ github.run_attempt }}
          path: target/homebrew-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90
  registry-install:
    name: Registry installation
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: registry-install
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/verify_installations.py registry --tag "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-install-${{ github.run_attempt }}
          path: target/registry-install.json
          if-no-files-found: error
          retention-days: 90
