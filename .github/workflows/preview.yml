name: Branch preview
run-name: 'Preview #${{ inputs.pr }} ${{ inputs.source_sha }} ${{ inputs.profile }}'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Open same-repository development PR number (draft is allowed)
        required: true
        type: string
      source_sha:
        description: Exact approved development commit (full 40-character SHA)
        required: true
        type: string
      profile:
        description: Native platforms to verify and publish
        required: true
        type: choice
        default: macos-arm64
        options: [macos-arm64, macos-intel, linux-arm64, linux-x64, all]
permissions:
  contents: read
  actions: read
  pull-requests: read
cache-mode: none
defaults:
  run:
    shell: bash
env:
  RUSTUP_TOOLCHAIN: 1.98.0
  MACOSX_DEPLOYMENT_TARGET: '15.0'
jobs:
  gate:
    name: Preview gate
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.identity.outputs.matrix }}
      snapshot: ${{ steps.identity.outputs.snapshot }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_build.py gate --identity "$RUNNER_TEMP/identity.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-identity-${{ github.run_attempt }}
          path: ${{ runner.temp }}/identity.json
          if-no-files-found: error
          retention-days: 30
  quality:
    name: Preview quality
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    cache-mode: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/preview-cache-check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_build.py prepare --source "$RUNNER_TEMP/candidate" --identity "$RUNNER_TEMP/identity.json"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ runner.temp }}/candidate -> target
          save-if: false
      - run: python3 scripts/install_tool.py cargo-deny --directory "$RUNNER_TEMP/preview-tools"
      - run: python3 scripts/install_tool.py gitleaks --directory "$RUNNER_TEMP/preview-tools"
      - run: python3 scripts/preview_build.py quality --source "$RUNNER_TEMP/candidate" --identity "$RUNNER_TEMP/identity.json" --directory "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-quality-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/quality.json
          if-no-files-found: error
          retention-days: 30
  build:
    name: Preview build (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    cache-mode: read
    env:
      TARGET: ${{ matrix.target }}
      CONTAINER: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/preview-cache-check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_build.py prepare --source "$RUNNER_TEMP/candidate" --identity "$RUNNER_TEMP/identity.json"
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ runner.temp }}/candidate -> target
          key: preview-${{ matrix.target }}
          save-if: false
      - run: python3 scripts/install_tool.py cargo-dist --directory "$RUNNER_TEMP/preview-tools"
      - name: Native macOS tests and archive
        if: runner.os == 'macOS'
        run: python3 scripts/preview_build.py build --source "$RUNNER_TEMP/candidate" --identity "$RUNNER_TEMP/identity.json" --target "$TARGET" --directory "$RUNNER_TEMP/evidence"
      - name: Native Linux tests and archive in glibc 2.28
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/candidate,dst=$RUNNER_TEMP/candidate" \
            --mount "type=bind,src=$RUNNER_TEMP/identity.json,dst=$RUNNER_TEMP/identity.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/evidence,dst=$RUNNER_TEMP/evidence" \
            --mount "type=bind,src=$RUNNER_TEMP/preview-tools,dst=$RUNNER_TEMP/preview-tools,readonly" \
            --mount "type=bind,src=$HOME/.rustup,dst=/rustup,readonly" \
            --mount "type=bind,src=$HOME/.cargo/bin,dst=/cargo-bin,readonly" \
            --workdir "$RUNNER_TEMP/candidate" \
            --env "RUSTUP_TOOLCHAIN=$RUSTUP_TOOLCHAIN" --env PREVIEW_PHASE=build \
            --env "PREVIEW_CONTROLLER=$PWD" --env "PREVIEW_SOURCE=$RUNNER_TEMP/candidate" \
            --env "PREVIEW_TOOLS=$RUNNER_TEMP/preview-tools" --env "PREVIEW_IDENTITY=$RUNNER_TEMP/identity.json" \
            --env "PREVIEW_OUTPUT=$RUNNER_TEMP/evidence" --env "PREVIEW_TARGET=$TARGET" \
            "$CONTAINER" bash "$PWD/scripts/preview_linux.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-build-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/*
          if-no-files-found: error
          retention-days: 7
  verify:
    name: Preview verify (${{ matrix.target }})
    needs: [gate, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    cache-mode: read
    env:
      TARGET: ${{ matrix.target }}
      CONTAINER: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/preview-cache-check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/preview_build.py prepare --source "$RUNNER_TEMP/candidate" --identity "$RUNNER_TEMP/identity.json"
          PYTHONPATH=scripts python3 - <<'PY'
          import os
          from pathlib import Path
          from preview_identity import trusted_run
          from preview_artifacts import download_evidence, platform_assets
          target = os.environ['TARGET']
          current = trusted_run(int(os.environ['GITHUB_RUN_ID']))
          download_evidence(current, f'Preview build ({target})', f'preview-build-{target}',
                            platform_assets(target) - {f'{target}-smoke.json'}, Path(os.environ['RUNNER_TEMP']) / 'evidence')
          PY
      - name: Fresh macOS executable verification
        if: runner.os == 'macOS'
        run: python3 scripts/preview_build.py verify --source "$RUNNER_TEMP/candidate" --identity "$RUNNER_TEMP/identity.json" --target "$TARGET" --directory "$RUNNER_TEMP/evidence"
      - name: Fresh Linux executable verification in glibc 2.28
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/preview-tools"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/candidate,dst=$RUNNER_TEMP/candidate" \
            --mount "type=bind,src=$RUNNER_TEMP/identity.json,dst=$RUNNER_TEMP/identity.json,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/evidence,dst=$RUNNER_TEMP/evidence" \
            --workdir "$RUNNER_TEMP/candidate" --env PREVIEW_PHASE=verify \
            --env "PREVIEW_CONTROLLER=$PWD" --env "PREVIEW_SOURCE=$RUNNER_TEMP/candidate" \
            --env "PREVIEW_TOOLS=$RUNNER_TEMP/preview-tools" --env "PREVIEW_IDENTITY=$RUNNER_TEMP/identity.json" \
            --env "PREVIEW_OUTPUT=$RUNNER_TEMP/evidence" --env "PREVIEW_TARGET=$TARGET" \
            "$CONTAINER" bash "$PWD/scripts/preview_linux.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-verified-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/*
          if-no-files-found: error
          retention-days: 7
  client:
    name: Preview client (${{ matrix.target }})
    needs: gate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    cache-mode: read
    env:
      TARGET: ${{ matrix.target }}
      CONTAINER: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/preview-cache-check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Package native macOS client from controller code
        if: runner.os == 'macOS'
        run: |
          python3 scripts/preview_client_build.py python --target "$TARGET" --directory "$RUNNER_TEMP/client-python"
          "$RUNNER_TEMP/client-python/python/bin/python3" -m venv "$RUNNER_TEMP/client-venv"
          "$RUNNER_TEMP/client-venv/bin/pip" install --require-hashes -r scripts/preview-client-requirements.txt
          "$RUNNER_TEMP/client-venv/bin/python" scripts/preview_client_build.py --target "$TARGET" --directory "$RUNNER_TEMP/client"
      - name: Package native Linux client in glibc 2.28
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/client"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/client,dst=$RUNNER_TEMP/client" \
            --env "CONTROLLER=$PWD" --env CLIENT_PHASE=build --env "TARGET=$TARGET" \
            --env "OUTPUT=$RUNNER_TEMP/client" "$CONTAINER" bash "$PWD/scripts/preview_client_linux.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-client-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client/*
          if-no-files-found: error
          retention-days: 7
  attest:
    name: Preview attest
    needs: [gate, quality, verify, client]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: preview-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_publish.py prepare --directory "$RUNNER_TEMP/public"
      - id: attest
        if: steps.prepare.outputs.existing != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/public/*.tar.xz
            ${{ runner.temp }}/public/preview-manifest.json
      - if: steps.prepare.outputs.existing != 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: python3 scripts/preview_publish.py finalize --directory "$RUNNER_TEMP/public" --bundle "$BUNDLE_PATH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-stage-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public/*
          if-no-files-found: error
          retention-days: 7
  install:
    name: Preview install (${{ matrix.target }})
    needs: [gate, attest]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    cache-mode: read
    env:
      TARGET: ${{ matrix.target }}
      CONTAINER: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/preview-cache-check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_publish.py download-stage --directory "$RUNNER_TEMP/stage"
      - name: Fresh native macOS installation lifecycle
        if: runner.os == 'macOS'
        run: python3 scripts/preview_install_check.py --target "$TARGET" --directory "$RUNNER_TEMP/stage" --report "$RUNNER_TEMP/stage/$TARGET-install.json"
      - name: Fresh native Linux installation lifecycle in glibc 2.28
        if: runner.os == 'Linux'
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=$PWD,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/stage,dst=$RUNNER_TEMP/stage" \
            --env "CONTROLLER=$PWD" --env CLIENT_PHASE=verify --env "TARGET=$TARGET" \
            --env "OUTPUT=$RUNNER_TEMP/stage" "$CONTAINER" bash "$PWD/scripts/preview_client_linux.sh"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-install-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage/${{ matrix.target }}-install.json
          if-no-files-found: error
          retention-days: 30
  publish:
    name: Preview publish
    needs: [gate, attest, install]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: preview-release
    concurrency:
      group: preview-${{ github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_publish.py prepare-publication --directory "$RUNNER_TEMP/public"
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: LorNtz
          repositories: fluxcope
          permission-contents: write
      - env:
          GH_TOKEN: ${{ github.token }}
          GIT_TOKEN: ${{ steps.app.outputs.token }}
          IMMUTABLE_RELEASES_ENABLED: ${{ vars.IMMUTABLE_RELEASES_ENABLED }}
        run: python3 scripts/preview_publish.py publish --directory "$RUNNER_TEMP/public"
  result:
    name: Preview result
    needs: [gate, quality, build, verify, client, attest, install, publish]
    if: always() && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      checks: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/preview_record.py
