name: Preview client packaging
on:
  pull_request:
    paths: ['scripts/preview_client/**', 'scripts/preview_client*.py', 'scripts/preview_client_linux.sh', 'scripts/preview-client-*.txt', 'scripts/preview-installer.sh.in', 'scripts/preview_install_check.py', '.github/preview-client-pins.json', '.github/workflows/preview*.yml', '.github/actions/package-preview-client/**']
  workflow_dispatch:
permissions:
  contents: read
cache-mode: none
defaults:
  run:
    shell: bash
env:
  MACOSX_DEPLOYMENT_TARGET: '15.0'
jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: platforms
        run: |
          python3 - <<'PYCODE'
          import json, os
          config = json.load(open('.github/release-config.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps({'include': config['platforms']}) + '\n')
          PYCODE
  client:
    name: Preview client (${{ matrix.target }})
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    cache-mode: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-preview-client
        with:
          target: ${{ matrix.target }}
          container: ${{ matrix.container }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-client-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/client/*
          if-no-files-found: error
          retention-days: 7
