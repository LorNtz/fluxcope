name: Publish Homebrew
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable tag to verify or recover in the personal tap'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  attestations: read
concurrency:
  group: homebrew-publication
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_gate.py distribution --tag "$TAG"
          python3 scripts/release_publish.py verify --tag "$TAG"
          python3 -c 'import json; assert json.load(open("target/release-identity.json"))["channel"] == "stable"'
  update:
    needs: gate
    runs-on: ubuntu-24.04
    environment: homebrew-release
    outputs:
      commit: ${{ steps.tap.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: LorNtz
          repositories: homebrew-tap
          permission-contents: write
      - id: tap
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/homebrew_release.py publish --tag "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tap-commit-${{ github.run_attempt }}
          path: target/tap-commit.json
          if-no-files-found: error
          retention-days: 90
  install:
    name: Homebrew (${{ matrix.target }})
    needs: [gate, update]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@304fc86d2c26bcd269547dbcfcfb4c853e710779 # reviewed 2026-09-14
        with:
          stable: true
          brew-gh-api-token: ''
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TAP_COMMIT: ${{ needs.update.outputs.commit }}
          TARGET: ${{ matrix.target }}
        run: python3 scripts/homebrew_release.py install --tag "$TAG" --commit "$TAP_COMMIT" --target "$TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-${{ matrix.target }}-${{ github.run_attempt }}
          path: target/homebrew-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90
  registry-install:
    name: Registry installation
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: registry-install
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/registry_install.py --tag "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-install-${{ github.run_attempt }}
          path: target/registry-install.json
          if-no-files-found: error
          retention-days: 90
