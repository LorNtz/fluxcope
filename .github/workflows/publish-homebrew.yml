name: Publish Homebrew
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published stable tag to verify or recover in the personal tap'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
  attestations: read
concurrency:
  group: homebrew-publication
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.gate.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release_gate.py distribution --tag "$TAG"
          python3 scripts/release_publish.py verify --tag "$TAG"
          python3 -c 'import json; assert json.load(open("target/release-identity.json"))["channel"] == "stable"'
  update:
    needs: gate
    runs-on: ubuntu-24.04
    environment: homebrew-release
    outputs:
      commit: ${{ steps.tap.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: LorNtz
          repositories: homebrew-tap
          permission-contents: write
      - id: tap
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ inputs.tag }}
        run: python3 scripts/homebrew_release.py publish --tag "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tap-commit-${{ github.run_attempt }}
          path: target/tap-commit.json
          if-no-files-found: error
          retention-days: 90
  install:
    name: Homebrew (${{ matrix.target }})
    needs: [gate, update]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.gate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-homebrew-install
        with:
          tag: ${{ inputs.tag }}
          tap-commit: ${{ needs.update.outputs.commit }}
          target: ${{ matrix.target }}
          tooling: release
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-${{ matrix.target }}-${{ github.run_attempt }}
          path: target/homebrew-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 90
  registry-install:
    name: Registry installation
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/verify-registry-install
        with:
          tag: ${{ inputs.tag }}
          tooling: release
          github-token: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-install-${{ github.run_attempt }}
          path: target/registry-install.json
          if-no-files-found: error
          retention-days: 90
