name: Build release artifacts
on:
  workflow_call:
    inputs:
      source:
        required: true
        type: string
      version:
        required: true
        type: string
      matrix:
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
defaults:
  run:
    shell: bash
jobs:
  local:
    name: Archive (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      CONTAINER: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: dist-${{ matrix.target }}
      - run: python3 scripts/install_tool.py cargo-dist --directory target/ci-tools
      - name: Build and exercise macOS archive
        if: runner.os == 'macOS'
        run: python3 scripts/dist_artifacts.py local --target "$TARGET" --version "$VERSION"
      - name: Build and exercise Linux archive in the declared glibc environment
        if: runner.os == 'Linux'
        run: |
          TOOLCHAIN=$(rustup show active-toolchain | cut -d ' ' -f 1)
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD,dst=/work" \
            --mount "type=bind,src=$HOME/.rustup,dst=/rustup,readonly" \
            --mount "type=bind,src=$HOME/.cargo/bin,dst=/cargo-bin,readonly" \
            --workdir /work --env "RUSTUP_TOOLCHAIN=$TOOLCHAIN" \
            "$CONTAINER" bash scripts/build_linux.sh "$TARGET" "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: local-${{ matrix.target }}
          path: target/local-artifacts/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
  global:
    name: Installers and manifest
    needs: local
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: rustup show active-toolchain
      - run: python3 scripts/install_tool.py cargo-dist --directory target/ci-tools
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: local-*
          path: target/distrib
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dist_artifacts.py global --version "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 7
          overwrite: true
