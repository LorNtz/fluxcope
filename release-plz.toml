[workspace]
release_always = false
dependencies_update = false
git_release_enable = false
git_tag_name = "v{{ version }}"
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]
publish_allow_dirty = false
publish_no_verify = false
# Fluxcope is distributed as an application; version intent is reviewed in the PR.
semver_check = false
repo_url = "https://github.com/LorNtz/fluxcope"

[changelog]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
protect_breaking_commits = true
# Design-only/docs commits must not appear as shipped app capabilities.
commit_parsers = [
  { message = "^(docs|test|style|chore|ci)(\\(|:)", skip = true },
  { message = "^feat", group = "added" },
  { message = "^fix", group = "fixed" },
  { message = "^security", group = "security" },
  { message = "^perf", group = "performance" },
  { message = ".*", group = "changed" },
]
