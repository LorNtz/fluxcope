[graph]
all-features = true
targets = [
  "aarch64-apple-darwin", "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu",
]

[advisories]
ignore = [
  # Build-time macro used by Ratatui/edtui. The advisory reports discontinued
  # maintenance, not a vulnerability. Reassess by 2026-12-14; metadata_check.py
  # enforces the matching expiry in .github/advisory-exceptions.json.
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is a transitive build-time macro; retained pending compatible TUI upgrades, expires 2026-12-14" },
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CC0-1.0", "Unlicense", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
