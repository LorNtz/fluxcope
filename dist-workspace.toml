[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# We own the workflow DAG and permissions; dist owns artifacts and installers.
ci = []
hosting = ["github"]
installers = ["shell", "homebrew"]
tap = "LorNtz/homebrew-tap"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
install-path = "~/.local/bin"
install-updater = false
source-tarball = false
checksum = "sha256"

[dist.min-glibc-version]
"*" = "2.28"
