[package]
name = "wirelens"
version = "0.1.0"
edition = "2024"

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-tree-widget = "0.23" # Essential for the request list panel

# Async & Runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# Proxy & Networking
hudsucker = "0.20" # The heavy lifter for MitM
hyper = { version = "0.14", features = ["client", "http1", "http2"] }
rcgen = "0.11" # For generating CA and leaf certs
rustls = "0.21"

# Data & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
http = "0.2"
url = "2.5"
brotli = "8"
flate2 = "1"
zstd = "0.13"

# Utilities
parking_lot = "0.12" # Faster Mutex/RwLock
anyhow = "1"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
unicode-segmentation = "1"
unicode-width = "0.2"
edtui = { version = "=0.9.9", default-features = false, features = ["arboard", "mouse-support"] }
tui-scrollview = "=0.5.1"
tui-textarea = { version = "0.7.0", default-features = false, features = ["ratatui"] }
globset = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "core_paths"
harness = false
