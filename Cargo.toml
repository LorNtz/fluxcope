[package]
name = "proxy-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = "0.28"
tui-tree-widget = "0.21" # Essential for the left panel

# Async & Runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Proxy & Networking
hudsucker = "0.20" # The heavy lifter for MitM
hyper = { version = "0.14", features = ["client", "http1", "http2"] }
rcgen = "0.11" # For generating CA and leaf certs
rustls = "0.21"
tokio-rustls = "0.24"

# Data & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
http = "0.2"
url = "2.5"

# Utilities
parking_lot = "0.12" # Faster Mutex/RwLock
log = "0.4"
uuid = "1.19.0"
qrcode = { version = "0.14", default-features = false }
