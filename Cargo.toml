[package]
name = "fluxcope"
version = "0.0.0-preview.35426855232"
edition = "2024"
rust-version = "1.98"
description = "A terminal HTTP and HTTPS debugging proxy with recording and request mapping"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LorNtz/fluxcope"
homepage = "https://github.com/LorNtz/fluxcope"
readme = "README.md"
keywords = ["proxy", "http", "https", "tui", "debugging"]
categories = ["command-line-utilities", "development-tools::debugging", "network-programming"]
include = ["/Cargo.toml", "/Cargo.lock", "/src/**", "/README.md", "/CHANGELOG.md", "/LICENSE-MIT", "/LICENSE-APACHE"]
autobenches = false

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["event-stream"] }
tui-tree-widget = "0.23" # Essential for the request list panel

# Async & Runtime
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt", "codec"] }
futures = "0.3"

# Proxy & Networking
hudsucker = { version = "0.25", default-features = false, features = ["rcgen-ca", "rustls-client", "http2"] }
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = { version = "0.1", features = ["channel"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
rustls = "0.23.45"
bytes = "1"

# Data & Serialization
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
json-event-parser = "0.2.3"
serde_yaml = "0.9"
http = "1"
url = "2.5"
brotli = "8"
flate2 = "1"
zstd = "0.13"

# Utilities
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
getrandom = "0.3"
sha2 = "0.10"
parking_lot = "0.12" # Faster Mutex/RwLock
anyhow = "1"
log = "0.4"
qrcode = { version = "0.14", default-features = false }
unicode-casefold = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"
edtui = { version = "=0.9.9", default-features = false, features = ["arboard", "mouse-support"] }
tui-scrollview = "=0.5.1"
tui-textarea = { version = "0.7.0", default-features = false, features = ["ratatui"] }
globset = "0.4"
tempfile = "3"
rmcp = { version = "=3.1.4", default-features = false, features = ["base64", "macros", "server", "client", "transport-io"] }
schemars = "1.1"

[features]
benchmark = []

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
rmcp = { version = "=3.1.4", default-features = false, features = ["transport-child-process"] }
portable-pty = "0.9"

[[bench]]
name = "core_paths"
harness = false
required-features = ["benchmark"]

[profile.dist]
inherits = "release"
lto = "thin"
# Keep unwinding so the TUI guard restores the terminal on a panic.
